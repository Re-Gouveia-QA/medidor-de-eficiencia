<!-- @dsCard group="Colors" viewport="700x180" name="Paper & Ink" subtitle="Base surface and text tones (light/dark)" -->
<!DOCTYPE html><html><head><link rel="stylesheet" href="../styles.css"></head>
<body style="margin:0;padding:20px;display:flex;gap:24px">
<div style="flex:1;background:var(--paper);border:var(--border-w) solid var(--ink);border-radius:10px;padding:16px;color:var(--ink);font-family:var(--font-body)">
  <div style="font-size:14px;color:var(--ink-soft)">Claro</div>
  <div style="display:flex;gap:10px;margin-top:8px">
    <div style="width:60px;height:60px;background:var(--paper);border:2px solid var(--ink);border-radius:6px"></div>
    <div style="width:60px;height:60px;background:var(--surface);border:2px solid var(--ink);border-radius:6px"></div>
    <div style="width:60px;height:60px;background:var(--surface-alt);border:2px solid var(--ink);border-radius:6px"></div>
    <div style="width:60px;height:60px;background:var(--ink);border-radius:6px"></div>
  </div>
</div>
<div data-theme="dark" style="flex:1;background:var(--paper);border:var(--border-w) solid var(--ink);border-radius:10px;padding:16px;color:var(--ink);font-family:var(--font-body)">
  <div style="font-size:14px;color:var(--ink-soft)">Escuro</div>
  <div style="display:flex;gap:10px;margin-top:8px">
    <div style="width:60px;height:60px;background:var(--paper);border:2px solid var(--ink);border-radius:6px"></div>
    <div style="width:60px;height:60px;background:var(--surface);border:2px solid var(--ink);border-radius:6px"></div>
    <div style="width:60px;height:60px;background:var(--surface-alt);border:2px solid var(--ink);border-radius:6px"></div>
    <div style="width:60px;height:60px;background:var(--ink);border-radius:6px"></div>
  </div>
</div>
</body></html>
