<!-- @dsCard group="Colors" viewport="700x150" name="Accent pens" subtitle="Blue, red, green, yellow — same use as ballpoint colors" -->
<!DOCTYPE html><html><head><link rel="stylesheet" href="../styles.css"></head>
<body style="margin:0;padding:20px;font-family:var(--font-body)">
<div style="display:flex;gap:16px">
  <div style="text-align:center">
    <div style="width:70px;height:70px;background:var(--accent-blue);border:2.5px solid var(--ink);border-radius:12px 8px 14px 9px"></div>
    <div style="margin-top:6px;font-size:13px;color:var(--ink-soft)">--accent-blue</div>
  </div><div style="text-align:center">
    <div style="width:70px;height:70px;background:var(--accent-red);border:2.5px solid var(--ink);border-radius:12px 8px 14px 9px"></div>
    <div style="margin-top:6px;font-size:13px;color:var(--ink-soft)">--accent-red</div>
  </div><div style="text-align:center">
    <div style="width:70px;height:70px;background:var(--accent-green);border:2.5px solid var(--ink);border-radius:12px 8px 14px 9px"></div>
    <div style="margin-top:6px;font-size:13px;color:var(--ink-soft)">--accent-green</div>
  </div><div style="text-align:center">
    <div style="width:70px;height:70px;background:var(--accent-yellow);border:2.5px solid var(--ink);border-radius:12px 8px 14px 9px"></div>
    <div style="margin-top:6px;font-size:13px;color:var(--ink-soft)">--accent-yellow</div>
  </div>
</div>
</body></html>
