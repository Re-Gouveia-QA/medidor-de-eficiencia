<!DOCTYPE html>
<html><head><link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="../../_ds_bundle.js"></script></head>
<body style="padding:20px">
<div id="root"></div>
<script type="text/babel">
const { Icon } = window.DS;
const names = ['chevron-down','check','x','plus','search','eye','eye-off','trash','user','mail','lock','calendar','star','bell','alert-triangle','info','arrow-right','edit','clock','tag','filter','home','logout'];
function App(){
  return (
    <div style={{display:'flex',flexWrap:'wrap',gap:'18px'}}>
      {names.map(n => (
        <div key={n} style={{display:'flex',flexDirection:'column',alignItems:'center',gap:'6px',fontSize:'13px',color:'var(--ink-soft)'}}>
          <Icon name={n} size={26} />
          <span>{n}</span>
        </div>
      ))}
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body></html>
